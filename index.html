<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>動く三角形がつくる曲面</title>
<style>
:root{color-scheme:light}
body{font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;margin:0;background:#f5f7fb;color:#172033}
header{padding:18px 22px 8px;max-width:1100px;margin:auto}
h1{font-size:clamp(1.25rem,3vw,1.8rem);margin:0 0 6px}
p{line-height:1.55;margin:6px 0}
main{max-width:1100px;margin:auto;padding:10px 16px 24px}
.panel{background:white;border:1px solid #dbe3ef;border-radius:14px;box-shadow:0 4px 18px #15233b0b;overflow:hidden}
canvas{display:block;width:100%;height:min(66vh,650px);min-height:380px;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 18px;border-top:1px solid #e3e9f2}
.control{min-width:0}
label{font-weight:650;display:block;margin-bottom:7px}
input[type=range]{width:100%}
small,.hint{color:#5d6b80;font-size:.9rem}
.checks{display:flex;gap:18px;flex-wrap:wrap;padding:0 18px 15px}
.status{padding:10px 18px;background:#f8faff;border-top:1px solid #e3e9f2;font-variant-numeric:tabular-nums}
@media(max-width:650px){.controls{grid-template-columns:1fr}canvas{min-height:330px;height:52vh}}
</style>
</head>
<body>
<header>
<h1>動く三角形がつくる曲面（3D可視化）</h1>
<p>パラメータ <b>k</b> を −π/2 から π/2 まで動かしたとき、三角形の3辺が通る面を表示します。ドラッグで視点回転、ホイールで拡大・縮小できます。</p>
</header>
<main>
<section class="panel">
<canvas id="view" aria-label="三角形の掃引曲面の3次元表示"></canvas>
<div class="controls">
<div class="control"><label for="k">現在の三角形： k = <span id="kv">0.000</span> rad（<span id="deg">0.0</span>°）</label><input id="k" type="range" min="-1.57079632679" max="1.57079632679" step="0.005" value="0"><small>スライダーで三角形の位置を確認できます。</small></div>
<div class="control"><label for="detail">曲面の分割数： <span id="dv">90</span></label><input id="detail" type="range" min="24" max="180" step="6" value="90"><small>分割数を増やすと滑らかになります。</small></div>
</div>
<div class="checks">
<label><input id="slices" type="checkbox" checked> 三角形の断面を表示</label>
<label><input id="wire" type="checkbox" checked> メッシュ線を表示</label>
<label><input id="axes" type="checkbox" checked> 座標軸を表示</label>
<label><input id="animate" type="checkbox"> 自動アニメーション</label>
</div>
<div class="status" id="status">頂点座標を計算しています。</div>
</section>
<p class="hint">数式の解釈：入力された3点を、各頂点の x・y・z 座標として読み取りました。第3成分はいずれも z = k です。</p>
</main>
<script>
(() => {
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d');
const kr=document.getElementById('k'), detail=document.getElementById('detail');
const kv=document.getElementById('kv'),deg=document.getElementById('deg'),dv=document.getElementById('dv');
const slices=document.getElementById('slices'),wire=document.getElementById('wire'),axes=document.getElementById('axes'),animate=document.getElementById('animate'),status=document.getElementById('status');
let yaw=-0.72,pitch=0.38,zoom=1,drag=false,lastX=0,lastY=0,lastTime=0;
const PI=Math.PI;
function verts(k){
 const c=Math.cos(k),s=Math.sin(k);
 return [
  [c*c,s*c,k],
  [(-Math.sqrt(3)/2*s-.5*c)*c,(-.5*s+Math.sqrt(3)/2*c)*c,k],
  [(Math.sqrt(3)/2*s-.5*c)*c,(-.5*s-Math.sqrt(3)/2*c)*c,k]
 ];
}
function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
function project(p){
 const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
 const x=p[0]*cy-p[1]*sy, y=p[0]*sy+p[1]*cy, z=p[2];
 const yy=y*cp-z*sp, zz=y*sp+z*cp;
 const w=canvas.clientWidth,h=canvas.clientHeight,scale=Math.min(w,h)*.34*zoom;
 return [w/2+x*scale,h/2-zz*scale,yy];
}
function path3(points,close=false){
 const q=points.map(project); if(!q.length)return;
 ctx.beginPath();ctx.moveTo(q[0][0],q[0][1]);for(let i=1;i<q.length;i++)ctx.lineTo(q[i][0],q[i][1]);if(close)ctx.closePath();return q;
}
function line3(a,b,color,width=1){path3([a,b]);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();}
function draw(){
 const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;
 ctx.clearRect(0,0,w,h);ctx.fillStyle='#fbfdff';ctx.fillRect(0,0,w,h);
 const n=+detail.value, ks=Array.from({length:n+1},(_,i)=>-PI/2+PI*i/n);
 const rows=ks.map(verts);
 // Render each swept side as a set of depth-sorted translucent triangles.
 let faces=[];
 for(let j=0;j<n;j++){
  for(let e=0;e<3;e++){
   const e2=(e+1)%3, p=rows[j][e],q=rows[j][e2],r=rows[j+1][e2],s=rows[j+1][e];
   faces.push({p:[p,q,r],color:e===0?'rgba(36,130,246,.27)':e===1?'rgba(20,184,166,.27)':'rgba(139,92,246,.27)'});
   faces.push({p:[p,r,s],color:e===0?'rgba(36,130,246,.27)':e===1?'rgba(20,184,166,.27)':'rgba(139,92,246,.27)'});
  }
 }
 faces.sort((a,b)=>a.p.reduce((t,p)=>t+project(p)[2],0)-b.p.reduce((t,p)=>t+project(p)[2],0));
 for(const f of faces){path3(f.p,true);ctx.fillStyle=f.color;ctx.fill();if(wire.checked){ctx.strokeStyle='rgba(35,65,105,.22)';ctx.lineWidth=.55;ctx.stroke();}}
 // Coordinate axes, slightly extended
 if(axes.checked){
  const L=1.25;
  [[[-L,0,0],[L,0,0],'#dc5252','x'],[[0,-L,0],[0,L,0],'#29966a','y'],[[0,0,-1.85],[0,0,1.85],'#35445b','z']].forEach(([a,b,col,label])=>{
   line3(a,b,col,1.5);const p=project(b);ctx.fillStyle=col;ctx.font='bold 14px system-ui';ctx.fillText(label,p[0]+5,p[1]-5);
  });
 }
 // Current triangle cross-section
 if(slices.checked){
  const v=verts(+kr.value);const q=path3(v,true);
  ctx.fillStyle='rgba(255,180,35,.28)';ctx.fill();ctx.strokeStyle='#d97706';ctx.lineWidth=2.2;ctx.stroke();
  v.forEach((p,i)=>{const z=project(p);ctx.beginPath();ctx.arc(z[0],z[1],4,0,Math.PI*2);ctx.fillStyle=['#dc5252','#2563eb','#15966a'][i];ctx.fill();});
 }
 // title/legend
 ctx.fillStyle='#243249';ctx.font='12px system-ui';ctx.fillText('辺 AB',14,22);ctx.fillStyle='#2482f6';ctx.fillRect(55,13,12,5);
 ctx.fillStyle='#243249';ctx.fillText('辺 BC',78,22);ctx.fillStyle='#14b8a6';ctx.fillRect(119,13,12,5);
 ctx.fillStyle='#243249';ctx.fillText('辺 CA',142,22);ctx.fillStyle='#8b5cf6';ctx.fillRect(183,13,12,5);
 const k=+kr.value,v=verts(k);
 kv.textContent=k.toFixed(3);deg.textContent=(k*180/PI).toFixed(1);dv.textContent=n;
 status.textContent=`k = ${k.toFixed(3)} rad　|　A(${v[0].map(a=>a.toFixed(3)).join(', ')})　B(${v[1].map(a=>a.toFixed(3)).join(', ')})　C(${v[2].map(a=>a.toFixed(3)).join(', ')})`;
}
kr.addEventListener('input',draw);detail.addEventListener('input',draw);
[slices,wire,axes].forEach(el=>el.addEventListener('change',draw));
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-lastX)*.008;pitch=Math.max(-1.45,Math.min(1.45,pitch+(e.clientY-lastY)*.008));lastX=e.clientX;lastY=e.clientY;draw();});
canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.45,Math.min(2.5,zoom*Math.exp(-e.deltaY*.001)));draw();},{passive:false});
function loop(t){if(animate.checked&&t-lastTime>25){let k=+kr.value+.012;if(k>PI/2)k=-PI/2;kr.value=k;draw();lastTime=t;}requestAnimationFrame(loop);}
new ResizeObserver(resize).observe(canvas);resize();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
